---

#----------------
# Required fields
#----------------
- field: labid
  description: Unique lab identifier (must match what you chose in the laboratory questionnaire).
  type: string
  options: []
  format: open
  pattern: .na
  lowerlimit: .na
  upperlimit: .na
  allow_decimals: .na
  min_decimals: .na
  max_decimals: .na
  required: yes
  NA_allowed: no
  error_message: ''

- field: participant_id
  description: unique ID for the participant - [acronym of your institution, not longer than 4 characters]_[3-digit participant number]
  type: string
  options: []
  format: regex
  pattern: ^[A-Za-z]{1,4}_[0-9]{3}$
  lowerlimit: .na
  upperlimit: .na
  allow_decimals: .na
  min_decimals: .na
  max_decimals: .na
  required: yes
  NA_allowed: no
  error_message: ''

- field: testing_date
  description: Date of testing, year/month/day, e.g. July 21, 2022 = 20220721
  type: numeric
  options: []
  format: open
  pattern: .na
  lowerlimit: .na
  upperlimit: .na
  allow_decimals: no
  min_decimals: .na
  max_decimals: .na
  required: yes
  NA_allowed: yes
  error_message: ''

- field: pilot
  description: yes = pilot data, no = final sample; You do NOT need to report pilot data, but if you do, it should be clearly marked here.
  type: options
