  lowerlimit: .na
  upperlimit: .na
  allow_decimals: .na
  min_decimals: .na
  max_decimals: .na
  required: yes
  NA_allowed: no

- field: trial_sequence
  description: which of the two trial orders was used for this participant?
  type: options
  options:
    - 'A'
    - 'B'
  format: open
  pattern: .na
  lowerlimit: .na
  upperlimit: .na
  allow_decimals: .na
  min_decimals: .na
  max_decimals: .na
  required: yes
  NA_allowed: no

- field: session_error
  description: (data should be excluded) - note, do not use this field for individual trial level errors if the participant is still going to be included.
  type: options
  options:
    - noerror
    - error
  format: open
  pattern: .na
  lowerlimit: .na
  upperlimit: .na
  allow_decimals: .na
  min_decimals: .na
  max_decimals: .na
  required: yes
  NA_allowed: no
  error_message: Invalid entry for session_error. Value must be 'noerror' or 'error'.

- field: session_error_type
  description: NA if no error; suggestions are “experimenter error” or “technical error”
