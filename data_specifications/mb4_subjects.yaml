  pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
  lowerlimit: .na
  upperlimit: .na
  allow_decimals: .na
  min_decimals: .na
  max_decimals: .na
  required: yes
  NA_allowed: yes
  error_message: ''

- field: age_group
