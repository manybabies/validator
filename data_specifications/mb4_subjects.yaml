---

#----------------
# Required fields
#----------------

- field: lab_id
  description: laboratory identifier, unique
  type: string
  options: []
  format: regex
  pattern: '^[a-z0-9]+$'
  lowerlimit: .na
  upperlimit: .na
  allow_decimals: .na
  min_decimals: .na
  max_decimals: .na
  required: yes
  NA_allowed: no
  error_message: ''

- field: subj_id
  description: subject identifier, non-identifying, unique
  type: string
  options: []
  format: regex
  pattern: '^[A-Za-z0-9]+$'
  lowerlimit: .na
  upperlimit: .na
  allow_decimals: .na
  min_decimals: .na
  max_decimals: .na
  required: yes
  NA_allowed: no
  error_message: ''

- field: date_tested
  description: Day child was tested, formatted YYYY-MM-DD, e.g. 2020-01-01
  type: string
