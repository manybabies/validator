---

- field:        lab_id
  description:  Unique lab identifier (must match LabID in MB5 Project Tracker)
  type:         string
  format:       alphanumeric, uncapitalized
  example:      'babylabPrinceton'
  required:     yes
  NA_allowed:   no

- field:        participant_id
  description:  Unique participant (subject) ID used by your lab. Must NOT contain any identifiable information (e.g., birthday, initials, name). Values in this field MUST MATCH those used in the participant_id field in the Participant Data file (i.e., this field will be used to align participant and trial data)
  type:         string
  format:       alphanumeric
  example:      'MB5_001'
  required:     yes
  NA_allowed:   no

- field:        familiarization_type
  description:  Whether the familiarization time was infant-controlled versus fixed-length
  type:         options
  options:      ['infant-controlled', 'fixed-length']
  required:     yes
  NA_allowed:   no

- field:        trial_num
  description:  Trial number, from 1–12
  type:         numeric
  format:       integer
  example:      1
  required:     yes
  NA_allowed:   no

- field:        familiarization_condition
  description:  The familiarization condition, in terms of the time allotted for viewing the familiarized stimulus
  type:         options
  options:      [5, 10, 15]
  required:     yes
  NA_allowed:   no

- field:        familiar_stimulus_filename
  description:  The name of the familiarized stimulus image
  type:         options
  options:      ['Arrow_Complex.png', 'Arrow_Simple.png', 'Bowl_Complex.png', 'Bowl_Simple.png', 'Bowtie_Complex.png', 'Bowtie_Simple.png', 'Crinkle_Complex.png', 'Crinkle_Simple.png', 'Cylinder_Complex.png', 'Cylinder_Simple.png', 'Diamond_Complex.png', 'Diamond_Simple.png', 'Gumdrop_Complex.png', 'Gumdrop_Simple.png', 'Pacman_Complex.png', 'Pacman_Simple.png', 'Pumpkin_Complex.png', 'Pumpkin_Simple.png', 'Pyramid_Complex.png', 'Pyramid_Simple.png', 'SimsDiamond_Complex.png', 'SimsDiamond_Simple.png', 'Tripod_Complex.png', 'Tripod_Simple.png', 'Frac1A_Complex.png', 'Frac1B_Complex.png', 'Frac2A_Complex.png', 'Frac2B_Complex.png', 'Frac3A_Complex.png', 'Frac3B_Complex.png', 'Frac4A_Complex.png', 'Frac4B_Complex.png', 'Frac5A_Complex.png', 'Frac5B_Complex.png', 'Frac6A_Complex.png', 'Frac6B_Complex.png', 'Frac1A_Simple.png', 'Frac1B_Simple.png', 'Frac2A_Simple.png', 'Frac2B_Simple.png', 'Frac3A_Simple.png', 'Frac3B_Simple.png', 'Frac4A_Simple.png', 'Frac4B_Simple.png', 'Frac5A_Simple.png', 'Frac5B_Simple.png', 'Frac6A_Simple.png', 'Frac6B_Simple.png']
  required:     yes
  NA_allowed:   no

- field:        novel_stimulus_filename
  description:  The name of the novel stimulus image
  type:         options
  options:      ['Arrow_Complex.png', 'Arrow_Simple.png', 'Bowl_Complex.png', 'Bowl_Simple.png', 'Bowtie_Complex.png', 'Bowtie_Simple.png', 'Crinkle_Complex.png', 'Crinkle_Simple.png', 'Cylinder_Complex.png', 'Cylinder_Simple.png', 'Diamond_Complex.png', 'Diamond_Simple.png', 'Gumdrop_Complex.png', 'Gumdrop_Simple.png', 'Pacman_Complex.png', 'Pacman_Simple.png', 'Pumpkin_Complex.png', 'Pumpkin_Simple.png', 'Pyramid_Complex.png', 'Pyramid_Simple.png', 'SimsDiamond_Complex.png', 'SimsDiamond_Simple.png', 'Tripod_Complex.png', 'Tripod_Simple.png', 'Frac1A_Complex.png', 'Frac1B_Complex.png', 'Frac2A_Complex.png', 'Frac2B_Complex.png', 'Frac3A_Complex.png', 'Frac3B_Complex.png', 'Frac4A_Complex.png', 'Frac4B_Complex.png', 'Frac5A_Complex.png', 'Frac5B_Complex.png', 'Frac6A_Complex.png', 'Frac6B_Complex.png', 'Frac1A_Simple.png', 'Frac1B_Simple.png', 'Frac2A_Simple.png', 'Frac2B_Simple.png', 'Frac3A_Simple.png', 'Frac3B_Simple.png', 'Frac4A_Simple.png', 'Frac4B_Simple.png', 'Frac5A_Simple.png', 'Frac5B_Simple.png', 'Frac6A_Simple.png', 'Frac6B_Simple.png']
  required:     yes
  NA_allowed:   no

- field:        familiarization_stimulus_screen_time
  description:  How long was the familiar stimulus presented on the screen, in milliseconds. If a trial was not conducted because the experiment ended early, enter NA (data not collected). For the fixed-length familiarization type, this duration will match the familiarization condition.
  type:         numeric
  format:       positive number, milliseconds
  example:      5000
  required:     yes
  NA_allowed:   yes

- field:        familiarization_stimulus_looking_time
  description:  How long the infant was looking at the stimulus during the familiarization period. This number can vary both in infant-controlled (if the trial times out before the target looking time is reached) and the fixed-length design (depending on infants' looking during the familiarization). The maximum value should be 15000 (the maximum familiarization time; though there could be a small amount of additional time due to imprecision in presentation timing - report the exact number in this case, as best as possible).
  type:         numeric
  format:       positive number, milliseconds (0-15000, may slightly exceed 15000 due to timing imprecision)
  example:      3206
  required:     yes
  NA_allowed:   yes

- field:        test_1_novel_stimulus_side
  description:  The side of the screen that the novel stimulus appeared during the first test period (first 5000ms)
  type:         options
  options:      ['left', 'right']
  required:     yes
  NA_allowed:   yes

- field:        test_1_looking_time_novel
  description:  "Looking time in milliseconds, to the novel stimulus in the first test trial period (first 5000ms) (range: 0-5000). If a trial was not conducted because the experiment ended early, enter NA (data not collected)"
  type:         numeric
  format:       positive number, milliseconds (0-5000)
  example:      2689
  required:     yes
  NA_allowed:   yes

- field:        test_1_looking_time_familiar
  description:  "Looking time in milliseconds to the familiar stimulus in the first test trial period (first 5000ms) (range: 0-5000). If a trial was not conducted because the experiment ended early, enter NA (data not collected)"
  type:         numeric
  format:       positive number, milliseconds (0-5000)
  example:      1154
  required:     yes
  NA_allowed:   yes

- field:        test_1_trial_time
  description:  Total test time duration in the first test trial period (first 5000ms) in milliseconds. If a trial was not conducted because the experiment ended early, enter NA (data not collected). This number should typically be 5000, but may be a little longer due to timing imprecision, which is why we track this number.
  type:         numeric
  format:       positive number, milliseconds
  example:      5000
  required:     yes
  NA_allowed:   yes

- field:        test_2_novel_stimulus_side
  description:  The side of the screen that the novel stimulus appeared during the second test period (second 5000ms)
  type:         options
  options:      ['left', 'right']
  required:     yes
  NA_allowed:   yes

- field:        test_2_looking_time_novel
  description:  "Looking time in milliseconds (range: 0-5000), to the novel stimulus in the second test trial period (second 5000ms). If a trial was not conducted because the experiment ended early, enter NA (data not collected)"
  type:         numeric
  format:       positive number, milliseconds (0-5000)
  example:      2689
  required:     yes
  NA_allowed:   yes

- field:        test_2_looking_time_familiar
  description:  Looking time in milliseconds to the familiar stimulus in the second test trial period (second 5000ms). If a trial was not conducted because the experiment ended early, enter NA (data not collected)
  type:         numeric
  format:       positive number, milliseconds (0-5000)
  example:      1154
  required:     yes
  NA_allowed:   yes

- field:        test_2_trial_time
  description:  Total test time duration in the second test trial period (second 5000ms) in milliseconds. If a trial was not conducted because the experiment ended early, enter NA (data not collected). This number should typically be 5000, but may be a little longer due to timing imprecision, which is why we track this number.
  type:         numeric
  format:       positive number, milliseconds
  example:      5000
  required:     yes
  NA_allowed:   yes

- field:        trial_error
  description:  Trials with 'error' value will be excluded from analysis
  type:         options
  options:      ['no_error', 'error']
  required:     yes
  NA_allowed:   no

- field:        trial_error_info
  description:  NA if no error; suggestions are 'experimenter_error', 'equipment_error', 'too_fussy', 'parent_interference' or 'experiment_ended_early'. Decision-making for whether a given trial reaches the level of exclusion for e.g. fussiness are made by the original coder, NOT centrally, so please do not provide overly detailed or ambiguous information here. Any decisions about fussiness must be made while masked to the exact stimulus on the screen.
  type:         string
  format:       open ended string
  example:      'experimenter_error'
  required:     yes
  NA_allowed:   yes

- field:        notes
  description:  "Use this field to make any comments about the trial that don't fit anywhere else (or enter NA if you don't have anything to add). For instance, if a baby's looks were particularly hard to code (but you managed/think the trial should still be included), you could note that here. Please DON'T enter this kind of information in other columns: if you write something like: test_time_looking_novel: 15003 but fuzzy/hard to code The computer scripts won't be able to read the looking time value. Instead, you can enter information like this: test_time_looking_novel: 15003 notes: Looks were fuzzy and hard to code"
  type:         string
  format:       open ended string
  example:      'Looks were fuzzy and hard to code'
  required:     yes
  NA_allowed:   yes
