#----------------
# Required fields
#----------------
#----------------
# Required fields
#----------------

- field: labid
  description: Unique lab identifier (must match what you chose in the laboratory questionnaire).
  type: string
  format: open
  pattern: .na
  lowerlimit: .na
  upperlimit: .na
  allow_decimals: .na
  min_decimals: .na
  max_decimals: .na
  required: yes
  NA_allowed: no

- field: participant_id
  description: unique ID for the participant - [acronym of your institution, not longer than 4 characters]_[3-digit participant number]
  type: string
  format: regex
  pattern: '^[A-Za-z]{1,4}_[0-9]{3}$'
  lowerlimit: .na
  upperlimit: .na
  allow_decimals: .na
  min_decimals: .na
  max_decimals: .na
  required: yes
  NA_allowed: no

- field: testing_date
  description: Date of testing, year/month/day, e.g. September 21, 2026 = 20260921 or NA
  type: numeric
  format: open
  pattern: .na
  lowerlimit: .na
  upperlimit: .na
  allow_decimals: no
  min_decimals: .na
  max_decimals: .na
  required: yes
  NA_allowed: yes

- field: pilot
  description: yes = pilot data, no = final sample; You do NOT need to report pilot data, but if you do, it should be clearly marked here.
  type: options
  options: ['yes', 'no']
  format: .na
  pattern: .na
  lowerlimit: .na
  upperlimit: .na
  allow_decimals: .na
  min_decimals: .na
  max_decimals: .na
  required: yes
  NA_allowed: no

