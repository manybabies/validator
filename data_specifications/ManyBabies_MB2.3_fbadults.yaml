- field: session_error_info
  description: Explanation of what caused the session error using exclusion criteria 1-4 defined in the lab manual (i.e., 1. Early termination, 2. Interference, 3. Experimenter error, 4. Technical problems). Use this field to report a reason that ALL data from this participant should be excluded from analysis. Write NA if no session level error
  type: options
  options: ['1', '2', '3', '4']
